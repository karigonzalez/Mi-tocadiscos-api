<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tocadiscos Virtual & Music API Console</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@300;400;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  
  <!-- Estilos CSS -->
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen flex flex-col font-sans selection:bg-cyan-500 selection:text-black">

  <!-- Main Container -->
  <div class="flex-1 max-w-7xl w-full mx-auto p-4 md:p-6 grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">
    
    <!-- LEFT PANEL: Turntable Console -->
    <div class="lg:col-span-8 flex flex-col gap-6">
      <div class="turntable-body rounded-3xl p-6 md:p-8 shadow-2xl relative overflow-hidden">
        
        <!-- Header Bar -->
        <div class="flex justify-between items-center mb-6 border-b border-cyan-500/20 pb-4">
          <div class="flex items-center gap-3">
            <div class="w-3 h-3 rounded-full bg-cyan-400 animate-pulse shadow-lg shadow-cyan-500/50"></div>
            <h1 class="text-2xl font-bold tracking-widest text-cyan-200 uppercase font-serif">HI-FI STEREO PHONOGRAPH</h1>
          </div>
          <div class="flex items-center gap-4 text-xs font-mono text-cyan-400/80">
            <span>WEB AUDIO API v2.0</span>
            <span>•</span>
            <span id="api-status" class="text-emerald-400">MUSIC API LIVE</span>
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-12 gap-6 items-center">
          
          <!-- Platter / Record Deck Section -->
          <div class="md:col-span-8 flex justify-center relative py-4">
            <!-- Plato Base (Platter + Slipmat) con textura realista -->
            <div class="relative w-[300px] h-[300px] sm:w-[360px] sm:h-[360px] rounded-full platter-mat p-3 flex items-center justify-center shadow-2xl">
              
              <!-- Eje Central Metálico (Spindle) visible aun sin disco -->
              <div class="absolute w-6 h-6 rounded-full bg-gradient-to-tr from-zinc-400 via-zinc-100 to-zinc-500 border-2 border-zinc-700 shadow-md z-10 flex items-center justify-center">
                <div class="w-2 h-2 rounded-full bg-zinc-900"></div>
              </div>

              <!-- Disco Vinilo (Se oculta o muestra dinámicamente) -->
              <div id="vinyl-record" class="w-full h-full rounded-full vinyl-grooves relative flex items-center justify-center cursor-grab active:cursor-grabbing shadow-2xl vinyl-visible z-20">
                <!-- Outer Ring -->
                <div class="w-full h-full rounded-full border border-zinc-700/30"></div>
                
                <!-- Center Label (Album Art) -->
                <div class="absolute w-32 h-32 rounded-full border-4 border-zinc-900 bg-zinc-800 shadow-inner flex flex-col items-center justify-center overflow-hidden p-2 text-center">
                  <img id="vinyl-label-img" src="https://images.unsplash.com/photo-1614613535308-eb5fbd3d2c17?auto=format&fit=crop&w=300&q=80" alt="Album Cover" class="absolute inset-0 w-full h-full object-cover opacity-80">
                  <div class="absolute inset-0 bg-black/40 backdrop-blur-[1px]"></div>
                  <span id="vinyl-label-title" class="relative text-[10px] font-bold text-cyan-200 line-clamp-2 uppercase drop-shadow-md z-10">NO TRACK LOADED</span>
                  <span id="vinyl-label-artist" class="relative text-[8px] text-cyan-400/80 line-clamp-1 z-10">Selecciona o Arrastra un Disco</span>
                  <div class="w-4 h-4 bg-zinc-950 border-2 border-cyan-500/80 rounded-full my-1 z-10"></div>
                </div>
              </div>

              <!-- Tonearm Assembly -->
              <div class="absolute top-2 right-2 w-28 h-72 pointer-events-none z-30">
                <!-- Arm Base Pivot -->
                <div class="absolute top-0 right-6 w-12 h-12 rounded-full bg-gradient-to-tr from-cyan-700 via-cyan-500 to-zinc-300 border-2 border-zinc-900 shadow-xl flex items-center justify-center pointer-events-auto">
                  <div class="w-6 h-6 rounded-full bg-zinc-900 border border-cyan-400"></div>
                </div>
                <!-- Metallic Tonearm Bar -->
                <div id="tonearm" class="absolute top-6 right-11 w-2 h-56 bg-gradient-to-r from-zinc-400 via-zinc-200 to-zinc-500 rounded-full shadow-2xl transition-transform duration-700 ease-in-out tonearm-rest">
                  <!-- Needle Cartridge -->
                  <div class="absolute bottom-0 -left-2 w-6 h-10 bg-cyan-600 border border-zinc-900 rounded-sm shadow-md flex items-center justify-center">
                    <div class="w-1 h-3 bg-zinc-200"></div>
                  </div>
                </div>
              </div>

            </div>
          </div>

          <!-- Controls Panel -->
          <div class="md:col-span-4 flex flex-col justify-between gap-4 bg-zinc-900/80 p-5 rounded-2xl border border-cyan-500/20 backdrop-blur-md">
            
            <!-- Power & Eject Controls -->
            <div class="grid grid-cols-2 gap-2">
              <div>
                <label class="text-[9px] font-mono text-cyan-400 uppercase block mb-1">POWER</label>
                <button id="power-btn" class="w-full py-2 bg-gradient-to-r from-cyan-600 to-blue-600 hover:from-cyan-500 hover:to-blue-500 text-white font-bold rounded-lg shadow-lg text-[11px] tracking-wide transition active:scale-95 flex items-center justify-center gap-1.5">
                  <i class="fa-solid fa-power-off"></i> <span id="power-text">START</span>
                </button>
              </div>

              <div>
                <label class="text-[9px] font-mono text-cyan-400 uppercase block mb-1">DISCO</label>
                <button id="eject-btn" class="w-full py-2 bg-zinc-800 hover:bg-zinc-700 text-red-400 border border-red-500/30 font-bold rounded-lg shadow-lg text-[11px] tracking-wide transition active:scale-95 flex items-center justify-center gap-1.5">
                  <i class="fa-solid fa-eject"></i> EJECT
                </button>
              </div>
            </div>

            <!-- Speed & RPM Selector -->
            <div class="flex justify-between items-center bg-zinc-950 p-2.5 rounded-xl border border-zinc-800">
              <span class="text-[10px] font-mono text-cyan-400 uppercase">VELOCIDAD RPM</span>
              <div class="flex bg-zinc-900 p-1 rounded-lg border border-zinc-700">
                <button id="rpm-33" class="px-2.5 py-1 text-xs font-mono rounded bg-cyan-500 text-black font-bold">33</button>
                <button id="rpm-45" class="px-2.5 py-1 text-xs font-mono rounded text-zinc-400 hover:text-white">45</button>
              </div>
            </div>

            <!-- Pitch Control Slider -->
            <div>
              <div class="flex justify-between text-xs font-mono text-cyan-300 mb-1">
                <span>PITCH / SPEED</span>
                <span id="pitch-val">1.0x</span>
              </div>
              <input id="pitch-slider" type="range" min="0.75" max="1.25" step="0.01" value="1.0" class="w-full accent-cyan-500 bg-zinc-950 h-2 rounded-lg cursor-pointer">
            </div>

            <!-- 3-Band Equalizer -->
            <div class="space-y-2 pt-1 border-t border-zinc-800">
              <span class="text-[9px] font-mono text-cyan-400 uppercase block">ANALOG 3-BAND EQ</span>
              
              <div class="grid grid-cols-3 gap-2 text-center">
                <div>
                  <label class="text-[8px] font-mono text-zinc-400 block mb-1">BASS</label>
                  <input id="eq-low" type="range" min="-12" max="12" value="0" class="w-full accent-cyan-500 bg-zinc-950 h-1.5 rounded-lg cursor-pointer">
                </div>
                <div>
                  <label class="text-[8px] font-mono text-zinc-400 block mb-1">MID</label>
                  <input id="eq-mid" type="range" min="-12" max="12" value="0" class="w-full accent-cyan-500 bg-zinc-950 h-1.5 rounded-lg cursor-pointer">
                </div>
                <div>
                  <label class="text-[8px] font-mono text-zinc-400 block mb-1">TREBLE</label>
                  <input id="eq-high" type="range" min="-12" max="12" value="0" class="w-full accent-cyan-500 bg-zinc-950 h-1.5 rounded-lg cursor-pointer">
                </div>
              </div>
            </div>

            <!-- Master Volume Slider -->
            <div>
              <div class="flex justify-between text-xs font-mono text-cyan-300 mb-1">
                <span>MASTER GAIN</span>
                <span id="vol-val">80%</span>
              </div>
              <input id="vol-slider" type="range" min="0" max="1" step="0.01" value="0.8" class="w-full accent-cyan-500 bg-zinc-950 h-2 rounded-lg cursor-pointer">
            </div>

          </div>

        </div>

        <!-- Realtime Visualizer & VU Meter -->
        <div class="mt-6 pt-4 border-t border-cyan-500/20 flex flex-col sm:flex-row items-center justify-between gap-4">
          <div class="w-full sm:w-2/3 h-14 bg-zinc-950 rounded-xl p-2 border border-zinc-800 overflow-hidden relative">
            <canvas id="visualizer" class="w-full h-full"></canvas>
          </div>

          <div class="flex items-center gap-4 bg-zinc-950 p-3 rounded-xl border border-zinc-800 w-full sm:w-1/3 justify-center">
            <div class="text-center">
              <span class="text-[9px] font-mono text-cyan-400 block">STEREO LEVEL</span>
              <div class="flex gap-1 items-end h-6 mt-1">
                <div id="vu-l" class="w-3 bg-cyan-500 rounded-sm transition-all duration-75" style="height: 10%;"></div>
                <div id="vu-r" class="w-3 bg-cyan-500 rounded-sm transition-all duration-75" style="height: 10%;"></div>
              </div>
            </div>
            <div class="text-left text-[11px] font-mono text-zinc-400 border-l border-zinc-800 pl-3">
              <div id="track-status" class="text-cyan-300 truncate max-w-[120px]">STOPPED</div>
              <div id="time-display" class="text-zinc-500">00:00 / 00:00</div>
            </div>
          </div>
        </div>

      </div>
    </div>

    <!-- RIGHT PANEL: Music API Search & Digital Rack -->
    <div class="lg:col-span-4 flex flex-col gap-6">
      
      <!-- API Search Box -->
      <div class="bg-zinc-900/80 p-5 rounded-3xl border border-cyan-500/20 shadow-xl backdrop-blur-md">
        <h2 class="text-sm font-bold text-cyan-300 uppercase tracking-widest mb-3 flex items-center gap-2 font-serif">
          <i class="fa-solid fa-magnifying-glass text-cyan-400"></i> Buscar Música
        </h2>

        <form id="search-form" class="flex gap-2">
          <input id="search-input" type="text" placeholder="Artista, canción o género..." class="flex-1 bg-zinc-950 border border-zinc-800 rounded-xl px-4 py-2 text-xs text-zinc-100 placeholder-zinc-500 focus:outline-none focus:border-cyan-500 transition">
          <button type="submit" class="bg-cyan-600 hover:bg-cyan-500 text-black font-bold px-4 py-2 rounded-xl text-xs transition active:scale-95">
            <i class="fa-solid fa-magnifying-glass"></i>
          </button>
        </form>

        <!-- Quick Tags -->
        <div class="flex gap-2 mt-3 overflow-x-auto pb-1 text-[10px] font-mono text-zinc-400">
          <button class="quick-tag bg-zinc-800 hover:bg-cyan-950 hover:text-cyan-200 px-2.5 py-1 rounded-md border border-zinc-700/50 transition">Synthwave</button>
          <button class="quick-tag bg-zinc-800 hover:bg-cyan-950 hover:text-cyan-200 px-2.5 py-1 rounded-md border border-zinc-700/50 transition">Daft Punk</button>
          <button class="quick-tag bg-zinc-800 hover:bg-cyan-950 hover:text-cyan-200 px-2.5 py-1 rounded-md border border-zinc-700/50 transition">Lo-Fi</button>
          <button class="quick-tag bg-zinc-800 hover:bg-cyan-950 hover:text-cyan-200 px-2.5 py-1 rounded-md border border-zinc-700/50 transition">Jazz</button>
        </div>
      </div>

      <!-- Vinyl / CD Rack Catalog -->
      <div class="bg-zinc-900/80 p-5 rounded-3xl border border-cyan-500/20 shadow-xl backdrop-blur-md flex-1 flex flex-col">
        <div class="flex justify-between items-center mb-4">
          <h2 class="text-sm font-bold text-cyan-300 uppercase tracking-widest font-serif flex items-center gap-2">
            <i class="fa-solid fa-compact-disc text-cyan-400"></i> Estantería de Discos
          </h2>
          <span class="text-[9px] font-mono text-zinc-500">CLIC O ARRASTRAR</span>
        </div>

        <!-- Scrollable Music Grid -->
        <div id="record-shelf" class="grid grid-cols-2 gap-3 overflow-y-auto max-h-[420px] pr-1 scrollbar-thin">
          <!-- Populado dinámicamente mediante JS -->
        </div>
      </div>

    </div>

  </div>

  <!-- JavaScript -->
  <script src="js/script.js"></script>
</body>
</html>
